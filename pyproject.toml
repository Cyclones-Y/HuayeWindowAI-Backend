[project]
name = "huaye-window-ai-backend"
version = "0.1.0"
description = "华业门窗 AI 效果预览微信小程序后端"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncmy>=0.2.10,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "loguru>=0.7.3,<1",
  "pydantic-settings>=2.10,<3",
  "redis>=6.4,<8",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "fakeredis>=2.31,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huaye_window_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/huaye_window_ai/api/**/*.py" = ["B008"]
"src/huaye_window_ai/integrations/wechat.py" = ["S105"]
"tests/**/*.py" = ["S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["huaye_window_ai"]

[[tool.mypy.overrides]]
module = ["asyncmy.*", "fakeredis.*"]
ignore_missing_imports = true
